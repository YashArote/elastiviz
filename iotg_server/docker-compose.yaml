services:
  # Development services
  postgres:
    image: pgvector/pgvector:pg16
    ports:
      - "8090:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: iotg
      POSTGRES_PASSWORD: "jm8aFPFFYM8McK6cEOl4jMZMdNnMyfCi"
    volumes:
      - iotg_data:/var/lib/postgresql/data

  redis:
    image: redis:6.2.6
    ports:
      - "8091:6379"
    command: redis-server --requirepass "VkgGmFoZoXcDu_trRuShsn7P_4R691VZ"
    environment:
      - REDIS_REPLICATION_MODE=master

  # Test services
  postgres_test:
    image: pgvector/pgvector:pg16
    ports:
      - "9090:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: iotg_test
      POSTGRES_PASSWORD: "_6_ybIm8u6cGyD4UZPc66h6ue2QJTG6l"
    volumes:
      - iotg_test_data:/var/lib/postgresql/data

  redis_test:
    image: redis:6.2.6
    ports:
      - "9091:6379"
    command: redis-server --requirepass "qmKh-fdHzKSwsDIgj3KSmPOc-fiYYPJo"
    environment:
      - REDIS_REPLICATION_MODE=master

volumes:
  iotg_data:
  iotg_test_data:
